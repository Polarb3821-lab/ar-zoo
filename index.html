<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AR 동물원</title>
<!-- Google model-viewer: 3D 표시 + AR(안드로이드 WebXR·Scene Viewer / iOS Quick Look) -->
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
         background: #f4f1ea; color: #222; }
  header { padding: 16px 20px 4px; }
  h1 { margin: 0; font-size: 22px; }
  p.sub { margin: 4px 0 0; color: #666; font-size: 14px; }
  #inapp { display:none; background:#ffe08a; padding:12px 20px; font-size:14px; line-height:1.5; }
  #inapp a { font-weight:700; color:#1a3fbf; }
  .tabs { display: flex; gap: 6px; padding: 12px 20px 0; }
  .tab { flex: 1; border: none; background: #e3ddd0; border-radius: 10px; padding: 10px;
         font-size: 15px; font-weight: 600; cursor: pointer; color: #555; }
  .tab.active { background: #222; color: #fff; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 20px; }
  .chip { flex: none; border: 1px solid #ccc; background: #fff; border-radius: 999px;
          padding: 8px 14px; font-size: 15px; cursor: pointer; }
  .chip.active { background: #1a73e8; color: #fff; border-color: #1a73e8; }
  model-viewer { width: 100%; height: 64vh; background: radial-gradient(#fff, #e6e1d6); }
  .info { padding: 12px 20px 30px; max-width: 720px; }
  .info h2 { margin: 0 0 4px; font-size: 20px; }
  .info .size { color: #666; font-size: 14px; }
  .info p { line-height: 1.6; }
  #diag { margin-top:8px; font-size:13px; background:#fff; border-radius:8px; padding:8px 10px; color:#444; }

  /* AR 시작 버튼 */
  .ar-btn { position: absolute; right: 12px; top: 12px;
            background: #1a73e8; color: #fff; border: none; border-radius: 999px;
            padding: 10px 18px; font-size: 15px; font-weight: 600; box-shadow: 0 2px 8px rgba(0,0,0,.25); }

  /* 조작 패널: 3D 화면과 AR(WebXR) 화면 모두에서 보임 */
  .panel { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%);
           width: min(96%, 460px); background: rgba(20,20,20,.72); color: #fff;
           border-radius: 16px; padding: 8px 10px 10px; backdrop-filter: blur(6px);
           -webkit-backdrop-filter: blur(6px); }
  .panel .title { display:flex; align-items:center; justify-content:space-between; gap:6px; }
  .panel .title b { font-size: 16px; text-align:center; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .panel .row { display:flex; gap:6px; margin-top:8px; }
  .panel button { flex:1; border:none; border-radius:10px; padding:10px 0; font-size:16px;
                  background: rgba(255,255,255,.16); color:#fff; cursor:pointer; }
  .panel button:active { background: rgba(255,255,255,.35); }
  .panel .nav { flex: none; width: 44px; }
  .panel .pcats { margin: 0 0 8px; }
  .panel .pcats button { padding: 7px 0; font-size: 14px; }
  .panel .pcats button.active { background: #1a73e8; }
  .panel .readout { font-size:12px; opacity:.8; text-align:center; margin-top:6px; }
  .panel .desc { display:none; font-size:13px; line-height:1.5; margin-top:8px; opacity:.95; }
  .panel.show-desc .desc { display:block; }
  /* AR 중에는 패널을 조금 위로, AR 시작 버튼은 숨김 */
  model-viewer[ar-status="session-started"] .panel,
  model-viewer[ar-status="object-placed"] .panel { bottom: 28px; }
  model-viewer[ar-status="session-started"] .ar-btn,
  model-viewer[ar-status="object-placed"] .ar-btn { display:none; }
  .ar-hint { display:none; position:absolute; top:16px; left:50%; transform:translateX(-50%);
             background:rgba(0,0,0,.6); color:#fff; padding:8px 14px; border-radius:999px; font-size:13px; }
  .ar-guide { display:none; position:absolute; top:16px; left:50%; transform:translateX(-50%);
              width:max-content; max-width:92%; background:rgba(0,0,0,.6); color:#fff; padding:8px 14px;
              border-radius:12px; font-size:13px; text-align:center; }
  model-viewer[ar-status="object-placed"] .ar-guide { display:block; }
  model-viewer[ar-tracking="not-tracking"] .ar-hint,
  model-viewer[ar-status="session-started"]:not([ar-tracking]) .ar-hint { display:block; }
</style>
</head>
<body>
<header>
  <h1>🦖 AR 동물원</h1>
  <p class="sub">모델을 고르고 휴대폰에서 “AR로 보기”를 누르세요.</p>
</header>

<div id="inapp"></div>
<div class="tabs" id="tabs"></div>
<div class="chips" id="chips"></div>

<model-viewer id="viewer"
  camera-controls touch-action="pan-y"
  autoplay shadow-intensity="1" exposure="1.1"
  ar ar-modes="webxr scene-viewer quick-look" ar-scale="auto" ar-placement="floor"
  alt="3D 모델">
  <div slot="ar-button" style="display:none"></div><!-- 기본 AR 버튼 숨김: 아래 버튼으로 직접 시작 -->
  <button class="ar-btn" id="arBtn" style="display:none">📱 AR로 보기</button>
  <div class="ar-hint">휴대폰을 천천히 움직여 바닥을 비춰 주세요</div>
  <div class="ar-guide">👆 모델 <b>발밑</b>을 끌면 이동 · 한 손가락으로 쓸면 회전 · 🤏 두 손가락으로 크기 조절</div>

  <div class="panel" id="panel">
    <div class="row pcats" id="pCats"></div>
    <div class="title">
      <button class="nav" data-act="prev">◀</button>
      <b id="pName"></b>
      <button class="nav" data-act="next">▶</button>
    </div>
    <div class="row">
      <button data-act="smaller">➖ 작게</button>
      <button data-act="fit30">📏 30cm</button>
      <button data-act="real">실제 크기</button>
      <button data-act="bigger">➕ 크게</button>
    </div>
    <div class="row">
      <button data-act="rotL">⟲ 45°</button>
      <button data-act="rotR">⟳ 45°</button>
      <button data-act="play" id="playBtn">⏸ 정지</button>
      <button data-act="anim" id="animBtn">🎬 동작</button>
      <button data-act="info">ℹ️</button>
    </div>
    <div class="readout" id="readout"></div>
    <div class="desc" id="pDesc"></div>
  </div>
</model-viewer>

<div class="info">
  <h2 id="name"></h2>
  <div class="size" id="size"></div>
  <p id="desc"></p>
  <div id="diag"></div>
</div>

<script src="catalog.js"></script>
<script>
const CATALOG = window.CATALOG;

const $ = id => document.getElementById(id);
const viewer = $("viewer"), tabs = $("tabs"), chips = $("chips"), panel = $("panel");
let cat = null, idx = 0, current = null;
const AR_HEIGHT = 0.30;          // AR 처음 등장 높이 (m)
let baseCenter = { x: 0, y: 0, z: 0 }, baseDiag = 0, baseHoriz = 0;
let sc = 1, yaw = 0, animIdx = 0, baseLength = 0, baseHeight = 0, arWanted = false;
// 동물·공룡 파일은 높이 30cm로 만들어져 있음 → 처음엔 배율 1 (이동 패드가 발밑에 정확히 깔림)
// real: 실제 크기가 되려면 몇 배 키워야 하는지 / 모든 모델에 real 값이 있음
const realScale = () => current?.real || 1;
const fit30 = () => (current?.real ? 1 : (baseHeight > 0 ? AR_HEIGHT / baseHeight : 1));

// ---- 카테고리 / 모델 선택 ----
Object.keys(CATALOG).forEach(c => {
  const b = document.createElement("button");
  b.className = "tab"; b.textContent = c; b.onclick = () => showCategory(c);
  tabs.appendChild(b);
});

// 패널 안 카테고리 버튼 (AR 화면에서 탭 바꾸기)
Object.keys(CATALOG).forEach(c => {
  const b = document.createElement("button");
  b.dataset.act = "cat"; b.dataset.cat = c; b.textContent = c;
  $("pCats").appendChild(b);
});

function showCategory(c) {
  cat = c;
  [...tabs.children].forEach(t => t.classList.toggle("active", t.textContent === c));
  [...$("pCats").children].forEach(t => t.classList.toggle("active", t.dataset.cat === c));
  chips.innerHTML = "";
  CATALOG[c].forEach((m, i) => {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = m.name; b.onclick = () => select(i);
    chips.appendChild(b);
  });
  select(startIdx); startIdx = 0;
}

function select(i) {
  const list = CATALOG[cat];
  idx = (i + list.length) % list.length;
  current = list[idx];
  [...chips.children].forEach((c, j) => c.classList.toggle("active", idx === j));
  yaw = 0; animIdx = 0;
  sc = 1; applyTransform();
  viewer.autoRotate = false;
  viewer.cameraTarget = "auto auto auto";   // 새 모델은 자동 맞춤
  viewer.cameraOrbit = "auto auto auto";
  viewer.maxCameraOrbit = "auto auto auto";
  viewer.src = current.src;
  $("name").textContent = $("pName").textContent = current.name;
  $("desc").textContent = $("pDesc").textContent = current.desc;
  $("size").textContent = "";
}

const inAR = () => ["session-started", "object-placed"].includes(viewer.getAttribute("ar-status"));

// ---- 로드 후 처리 (모델 파일이 이미 실제 크기(m)로 만들어져 있음) ----
viewer.addEventListener("load", async () => {
  const d = viewer.getDimensions();
  baseLength = Math.max(d.x, d.y, d.z); baseHeight = d.y; baseDiag = Math.hypot(d.x, d.y, d.z); baseHoriz = Math.hypot(d.x, d.z);
  const bc = viewer.getBoundingBoxCenter(); baseCenter = { x: bc.x, y: bc.y, z: bc.z };
  sc = 1;
  applyTransform();
  reframe();
  const anims = animList();
  $("animBtn").style.display = anims.length > 1 ? "" : "none";
  $("playBtn").style.display = anims.length ? "" : "none";
  if (anims.length) {
    // 기본 동작: 걷기 → 대기 → 첫 번째 순
    const base = a => a.replace(/^.*\|/, "");
    const pick = anims.find(a => /^walk$/i.test(base(a))) || anims.find(a => /walk|swim/i.test(a)) || anims.find(a => /idle/i.test(a)) || anims[0];
    animIdx = anims.indexOf(pick);
    viewer.animationName = pick; viewer.play();
  }
  $("playBtn").textContent = "⏸ 정지";
  const realH = baseHeight * realScale();
  $("size").textContent = current.real ? `실제 높이: 약 ${realH >= 1 ? realH.toFixed(1) + " m" : Math.round(realH * 100) + " cm"} (처음엔 30cm로 보여요)` : `크기: 약 ${Math.round(baseLength * 100)} cm`;
  writeDiag();
});

function applyTransform() {
  const newScale = `${sc} ${sc} ${sc}`, newOri = `0deg 0deg ${yaw}deg`;
  if (viewer.scale !== newScale) viewer.scale = newScale;          // 바뀔 때만 적용
  if (viewer.orientation !== newOri) viewer.orientation = newOri;
  const fmt = m => { const cm = Math.round(m * 100); return cm >= 100 ? (cm / 100).toFixed(1) + " m" : cm + " cm"; };
  $("readout").textContent = `높이 약 ${fmt(baseHeight * sc)} · 실제의 ×${+(sc / realScale()).toFixed(2)} · 회전 ${((yaw % 360) + 360) % 360}°`;
}

const animList = () => animFilter(viewer.availableAnimations);

async function reframe() {
  await viewer.updateComplete;
  if (inAR()) return;
  const aspect = Math.min(viewer.clientWidth / Math.max(viewer.clientHeight, 1), 1);  // 세로 화면이면 가로 폭 기준
  // 패널 위 빈 공간(화면 위쪽 60%)에 모델 높이·가로 폭이 모두 들어가는 거리
  const r = Math.max(baseHeight * 6, baseHoriz * 2.3 / aspect, 0.4 / sc) * sc;
  // 아래쪽 조작 패널에 가리지 않게 모델을 화면 위쪽으로 (카메라 목표점을 조금 아래로)
  const c = { x: baseCenter.x * sc, y: baseCenter.y * sc, z: baseCenter.z * sc };   // 크기는 원점 기준으로 바뀜
  viewer.cameraTarget = `${c.x.toFixed(3)}m ${(c.y - 0.11 * r).toFixed(3)}m ${c.z.toFixed(3)}m`;
  viewer.fieldOfView = "30deg";
  viewer.cameraOrbit = `auto auto ${r.toFixed(3)}m`;
  viewer.maxCameraOrbit = `auto auto ${(r * 4).toFixed(3)}m`;
  viewer.jumpCameraToGoal();
}

// ---- 조작 패널 (3D 화면 + AR 화면 공통) ----
const actions = {
  prev:    () => select(idx - 1),
  next:    () => select(idx + 1),
  smaller: () => { sc = sc / 1.5; applyTransform(); reframe(); },
  bigger:  () => { sc = sc * 1.5; applyTransform(); reframe(); },
  fit30:   () => { sc = fit30(); applyTransform(); reframe(); },
  real:    () => { sc = realScale(); applyTransform(); reframe(); },
  rotL:    () => { yaw += 45; applyTransform(); },
  rotR:    () => { yaw -= 45; applyTransform(); },
  play:    () => {
    if (viewer.paused) { viewer.play(); $("playBtn").textContent = "⏸ 정지"; }
    else { viewer.pause(); $("playBtn").textContent = "▶ 재생"; }
  },
  anim:    () => {
    const a = animList();
    if (!a.length) return;
    animIdx = (animIdx + 1) % a.length;
    viewer.animationName = a[animIdx]; viewer.play();
    $("playBtn").textContent = "⏸ 정지";
    $("readout").textContent = `동작: ${animLabel(a[animIdx])}`;
  },
  info:    () => panel.classList.toggle("show-desc"),
};
panel.addEventListener("click", e => {
  const b = e.target.closest("button[data-act]");
  if (b) { e.stopPropagation(); b.dataset.act === "cat" ? showCategory(b.dataset.cat) : actions[b.dataset.act](); }
});
// AR 중 버튼 누를 때 모델이 그 자리로 옮겨지지 않게 막기
panel.addEventListener("beforexrselect", e => e.preventDefault());
// 3D 화면에서 패널 위 드래그가 카메라 회전으로 넘어가지 않게
["pointerdown", "touchstart", "mousedown"].forEach(t =>
  panel.addEventListener(t, e => e.stopPropagation(), { passive: true }));

// ---- 앱 내 브라우저 안내 + 진단 ----
const ua = navigator.userAgent;
const isAndroid = /Android/i.test(ua), isIOS = /iPhone|iPad|iPod/i.test(ua);
const inApp = /KAKAOTALK|NAVER|Instagram|FBAN|FBAV|Line\/|DaumApps|everytimeApp|; wv\)/i.test(ua);
if (inApp) {
  const box = $("inapp"); box.style.display = "block"; const url = location.href;
  if (/KAKAOTALK/i.test(ua))
    box.innerHTML = `⚠️ 카카오톡 안에서는 AR이 열리지 않아요. <a href="kakaotalk://web/openExternal?url=${encodeURIComponent(url)}">외부 브라우저로 열기</a>`;
  else if (isAndroid)
    box.innerHTML = `⚠️ 앱 안의 브라우저에서는 AR이 열리지 않아요. <a href="intent://${url.replace(/^https?:\/\//, "")}#Intent;scheme=https;package=com.android.chrome;end">Chrome으로 열기</a>`;
  else
    box.innerHTML = "⚠️ 앱 안의 브라우저에서는 AR이 열리지 않아요. 메뉴에서 ‘Safari로 열기’를 눌러 주세요.";
}

function writeDiag() {
  $("diag").innerHTML =
    `기기: ${isAndroid ? "안드로이드" : isIOS ? "iOS" : "PC/기타"} · HTTPS: ${location.protocol === "https:" ? "✅" : "❌"} · 앱 내 브라우저: ${inApp ? "⚠️ 예" : "아니오"}<br>` +
    `AR 사용 가능: ${viewer.canActivateAR ? "✅ 예" : "❌ 아니오 (기기·브라우저 미지원)"}`;
}
viewer.addEventListener("error", e => {
  $("diag").innerHTML += `<br>❌ 모델을 불러오지 못했어요: ${current?.src} — 파일이 함께 올라갔는지 확인하세요.`;
});
viewer.addEventListener("ar-status", e => {
  const st = e.detail.status;
  if (st === "session-started") viewer.autoRotate = false;
  if (st === "not-presenting" || st === "failed") {      // AR 종료 → 3D 화면은 실제 크기로 복귀
    arWanted = false; sc = 1; applyTransform(); reframe();
    viewer.autoRotate = false;
  }
  if (st === "failed")
    $("diag").innerHTML += isAndroid
      ? "<br>AR 실패 → Play 스토어에서 ‘Google Play 서비스(AR)’를 설치·업데이트해 주세요."
      : "<br>AR 실패 → Safari에서 열었는지, iOS가 최신인지 확인해 주세요.";
});

// ---- AR 시작: 높이 30cm로 맞춘 뒤 시작 → 가까운 곳에 작게 등장, 이후 두 손가락으로 자유롭게 크기 조절 ----
const arBtn = $("arBtn");
arBtn.addEventListener("click", async e => {
  e.stopPropagation();
  arWanted = true; yaw = 0; sc = 1; applyTransform();   // 배율 1로 시작 → 30cm, 패드는 발밑
  await viewer.updateComplete;
  viewer.activateAR();
});
viewer.addEventListener("load", () => { arBtn.style.display = viewer.canActivateAR ? "" : "none"; });

// model-viewer가 준비된 뒤에 시작
// 주소에 ?cat=..&i=.. 가 있으면 그 모델로 시작
const q = new URLSearchParams(location.search);
let startIdx = parseInt(q.get("i")) || 0;
const startCat = CATALOG[q.get("cat")] ? q.get("cat") : Object.keys(CATALOG)[0];
customElements.whenDefined("model-viewer").then(() => showCategory(startCat));
</script>
</body>
</html>
